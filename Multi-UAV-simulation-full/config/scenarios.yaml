  # ── 真机部署门槛（pair2/trio3 的 P2 三件套，对应 S14–S16 的 cross5 版）──────
  # killnode 判定依据(2026-07-14, c2e7759)：被杀机 mpc 静默但其 PX4 仍发位置时，
  # 幸存机对它的编队项 d_star 动态置为当前距离(失效化)——修复前编队项把幸存机拽向
  # 趴窝机形成恒定偏差(S23 0.8m / S24 圆周振荡 0↔1.5m)。修复后预期幸存机 pos_err
  # 正常(<0.5)；若复发,先查 launch 日志 formation-neutral 是否触发。
  S23_pair2_killnode:                       # 双机杀一机：剩余机应稳定悬停不受扰
