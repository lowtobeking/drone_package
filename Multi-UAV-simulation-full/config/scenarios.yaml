  # ── S42/S43：突发通信中断（补 S25 的盲区，2026-07-22 新增）──────────────────
  # S25(200ms 延迟 + 20% i.i.d. 丢包)**从未真正触发 neighbour_timeout 降级**：
  # 20% 丢包下连续丢满 2s(50Hz→100 条)的概率约 1e-70。而真实 2.4G 无线的典型
  # 失效是遮挡/干扰造成的**突发中断**（连续断数百 ms~数秒后恢复），与 i.i.d.
  # 稀疏丢包是两回事。这两条专测「降级进得去、恢复出得来」。
  # blackout 时间基准 = 节点启动时刻 → start_s 须覆盖 leader start_delay(30s)+起飞收敛。
  S42_trio3_commsblackout:                  # 断 3s / 每 15s 一次（> neighbour_timeout=2s）
    formation: trio3
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center,
             ready_hold: 20.0, ready_pos_err: 0.3}
    duration_s: 240
    faults: {comms_blackout_duration_s: 3.0, comms_blackout_period_s: 15.0,
             comms_blackout_start_s: 90.0}

  S43_trio3_commsblackout_long:             # 断 6s / 每 30s 一次：探中断时长上限
    formation: trio3
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center,
             ready_hold: 20.0, ready_pos_err: 0.3}
    duration_s: 300
    faults: {comms_blackout_duration_s: 6.0, comms_blackout_period_s: 30.0,
             comms_blackout_start_s: 90.0}

  # S44：**大包选择性丢失**（scope=pred，只断预测、位置/health 照常）。
  # 这是无线劣化的典型形态（预测 ~800-1000B 比位置 ~100-200B 更易丢），也是
  # 趴窝误判的触发条件：旧判据("预测过期+位置新鲜")会把它当成队友 mpc 崩溃、
  # 关掉编队项。2026-07-22 实测旧版误触发 81 次；加 health 门后应降为 0。
  S44_trio3_predloss:
    formation: trio3
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center,
             ready_hold: 20.0, ready_pos_err: 0.3}
    duration_s: 240
    faults: {comms_blackout_duration_s: 3.0, comms_blackout_period_s: 15.0,
             comms_blackout_start_s: 90.0, comms_blackout_scope: pred}

  # S45：**差模扰动 + 断连**（killnode 叠加 blackout）—— 这是 S42/S43 测不到的那半边。
  # S42 断连影响仅 +0.01m、叠加风后 +0.000m，因为那些扰动都是**共模**的（三机同向
  # 偏移、相对队形不变），"邻居在队形位上"这个 L3 推断依然≈真值。
  # 本场景制造**差模**：t=45s 杀 drone1 的 mpc → PX4 接管、它趴在原地脱离队形，
  # 而幸存机绕圆周(周期≈63s)每圈都会经过它附近。断连期间幸存机对它走 L3，
  # 推断它"还在队形位上"——**碰撞规避正是基于这个错误位置工作的**。
  # 对照基线：S24 同参数无 blackout，min_spacing 最小 4.417m（2026-07-22 实测）。
  S45_trio3_killnode_blackout:
    formation: trio3
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center,
             ready_hold: 20.0, ready_pos_err: 0.3}
    duration_s: 240
    # ⚠️ kill_at_s 必须**晚于编队就绪**：就绪门控要求全员 pos_err<0.3 保持 20s，
    # 杀早了永远凑不齐 → 门控超时、整个 trial 被脚本丢弃（2026-07-22 用 45s 实测踩到；
    # S24 能过只是它那次起飞恰好够快）。这里排成 90s 断连 → 100s 杀节点，
    # 先看纯断连、再看断连+趴窝的演进。
    faults: {kill_drone: 1, kill_at_s: 100,
             comms_blackout_duration_s: 3.0, comms_blackout_period_s: 15.0,
             comms_blackout_start_s: 90.0, comms_blackout_scope: all}

  # ══ S27+ safety_filter SITL 回归·诱发场景（真机门禁，配套 report/safety_filter_SITL回归清单.md）══
  # 共性说明：
  #  · 诱发类场景 verdict 预期不按常规 PASS 判（thresholds 已放宽），判定以节点日志
  #    `SAFETY <state> <reasons>` + analyze_flight 轨迹为准；清单里写了每场景的预期日志。
  #  · safety_* 参数在 mpc_node 构造时读一次 → 改本文件后必须 colcon build 才生效。
  #  · ⚠️ 碰撞地板检查不受 grace 门控：诱发碰撞保护时 d_emergency/d_warn 必须 < 出生间距，
  #    否则飞机在地面就 HOLD→RELINQUISH、起飞锁死（清单原“抬 d_emergency 到 5.5”法不可用，
  #    这里改用 offsets_scale 缩小空中队形目标制造真实接近）。

  S27_solo1_fence_line:                     # 飞散围栏·追线诱发（Phase1 第1行）
    formation: solo1
    leader: {mode: line, speed: 1.0, max_distance: 20.0, yaw_mode: tangent}
    # 0.3m 压到稳态滞后以下保证触发。追线时机头速度指向参考点(v_out<0)，按 safety_filter
    # 代码只会给 severity1 → 预期停在 DEGRADED 半速追、不升级 RELINQUISH；
    # 预期日志: flyaway_near/flyaway_converging + SAFETY DEGRADED；leader 到头停走后
    # 应观察到 ok_streak 达 clear_frames 回 NORMAL（迟滞降级闭环）。
    limits: {safety_max_track_dist: 0.3}
    thresholds: {pos_err: 99.0, total_fallbacks: 99999}
    criteria: log      # 定案看节点日志 SAFETY 状态链，非 CSV 阈值

  S28_solo1_fence_circle:                   # 飞散围栏·圆周诱发（径向滞后触 breach 刹车）
    formation: solo1
    leader: {mode: circle, speed: 1.5, radius: 10.0, yaw_mode: center}
    # 圆周入轨/跟踪径向滞后远超 1m（S0 同场景须放围栏到 15 才不触发）→ 必然越界；
    # 圆周中 v_out 周期性 >0 → 预期日志: flyaway_breach(刹外扩分量) 混 flyaway_converging，
    # 可能间歇 HOLD。观察轨迹被“拽住”不外飞。
    limits: {safety_max_track_dist: 1.0}
    thresholds: {pos_err: 99.0, total_fallbacks: 99999}
    criteria: log      # 定案看节点日志 SAFETY 状态链，非 CSV 阈值

  S29_trio3_squeeze_warn:                   # 碰撞地板·真实接近（d_warn 带内均衡，Phase1 第3行）
    formation: trio3
    leader: {mode: hover}
    # 出生间距不变(5.196m，起飞不锁死)；空中队形目标缩到 5.196*0.35≈1.82m，
    # 落在 d_warn=2.0 与 d_emergency=1.2 之间 → 持续 collide_warn 抑制接近+排斥。
    # 预期: 均衡间距 ≈ d_warn 附近(1.9~2.1m)，min spacing 全程 > d_emergency=1.2，
    # 无 collide_emerg 日志；状态 DEGRADED 持续（severity1）。
    offsets_scale: 0.35
    thresholds: {min_spacing: 1.3, pos_err: 99.0, total_fallbacks: 99999}
    criteria: log      # 定案看节点日志 SAFETY 状态链，非 CSV 阈值

  S30_trio3_squeeze_emerg:                  # 碰撞地板·emerg 全停 + 多机同时 RELINQUISH（Phase1 第2行替代法 + Phase2 互不连累）
    formation: trio3
    leader: {mode: hover}
    # d_emergency 抬到 2.2（< 出生间距 5.196 不锁死；> 队形目标 1.82 必触发）→ d_warn=2.7。
    # 预期: 收敛进 2.7 先 collide_warn，进 2.2 collide_emerg 横向全停(severity2)
    # → HOLD → ~1s → RELINQUISH（三机可能同时）。min spacing 冻结在 ≈2.1~2.2，绝不 <1.9。
    # 顺带观察: 多机 RELINQUISH 互不连累 + PX4 是否接管（同 S31 的链路问题）。
    offsets_scale: 0.35
    limits: {safety_d_emergency: 2.2}
    thresholds: {min_spacing: 1.9, pos_err: 99.0, total_fallbacks: 99999}
    criteria: log      # 定案看节点日志 SAFETY 状态链，非 CSV 阈值

  S31_solo1_relinquish_alt:                 # 🔴 RELINQUISH→PX4 接管链·确定性诱发（放飞门槛第3条）
    formation: solo1
    # 本场景**故意**让 target_alt 越过 safety_max_alt（见下），故豁免
    # tools/check_scenario_envelope.py 的包络检查，否则该工具会有已知误报。
    envelope_check: false
    leader: {mode: hover}
    # max_alt=3.0 < target_alt=5.0 → 爬升越 3m 后 fence_alt_high 压帽(severity2 持续)
    # → HOLD(零速悬停~3m) → 1s → RELINQUISH 停发 setpoint。
    # ⚠️ 前提: 先按 report/真机安全配置清单_FC.md 在 SITL PX4 配 COM_OF_LOSS_T/COM_OBL_RC_ACT，
    #    QGC 肉眼确认 PX4 切 Hold/Land —— 这一步是清单头号门禁。
    # ✅ 已定案(2026-07-14 reg_lag_20260713 批次日志取证): 方案b(d1fab29)实测打通——
    #    RELINQUISH 后 nav_state 14(OFFBOARD)→4(AUTO_LOITER) 稳定保持到场景结束，
    #    "重发 DO_SET_MODE" 日志零次出现(=PX4 首条指令即接管成功)，停流彻底。
    #    旧预判(2026-07-03"心跳不停→COM_OF_LOSS_T 不触发")对应的隐患已由方案b消除。
    #    另: RELINQUISH 跨架次解闩见 mpc_node._on_vehicle_status(disarmed→armed 边沿 reset)。
    limits: {safety_max_alt: 3.0}
    thresholds: {pos_err: 99.0, total_fallbacks: 99999}
    criteria: log      # 定案看节点日志 SAFETY 状态链，非 CSV 阈值

  S32_solo1_circle_nosafety:                # Phase0 A/B 基线：safety 关，与 S0_solo1_circle 对比
    formation: solo1
    leader: {mode: circle, speed: 1.5, radius: 10.0, yaw_mode: center}
    limits: {safety_filter_enable: false}

  S_solo1_circle_nosafety_s1:               # 单机风扰基线(论文 §5.5 单机锚点)：与 S34 cross5
    formation: solo1                        # 完全同参(圆周 speed 1.0/radius 10/nosafety)、仅单机。
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center}
    limits: {safety_filter_enable: false}   # legacy 用 tau:=0.0、fix 用默认 0.5。用于判"~120m
    # 发散是单机滞后本身还是队形放大"：solo1 legacy 若也 ~120m ⇒ 单机滞后主导、耦合放大有限。

  S33_trio3_circle_nosafety:                # Phase0 A/B 基线：safety 关，与 S3_trio3_circle 对比
    formation: trio3
    leader: {mode: circle, speed: 1.5, radius: 10.0, yaw_mode: center}
    limits: {safety_filter_enable: false}

  S34_cross5_circle_nosafety:               # 风扰对照(W 系)：与 S5 完全同参、仅关 safety——
    formation: cross5                       # 分离"MPC 本体抗风"与"围栏对风扰的级联误杀"两个效应。
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, w_collision: 500.0, vel_lag_tau: 0.0}  # legacy A 基线：默认转 0.5 后须显式钉 0
    # 风扰本身在 Gazebo 侧注入（ApplyLinkWrench 持续 wrench，见报告 §5.F 复现命令），yaml 不编码。

  S38_cross5_circle_nocouple:               # 审稿意见 M1/M2（2026-08-17）：完全解耦对照。
    formation: cross5                       # 与 S34 同参，但**同时**关掉显式队形项与碰撞项 ⇒ 五架机
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, w_collision: 0.0, w_formation: 0.0, vel_lag_tau: 0.0}
    # 之间只剩"共享领队参考 + 共同世界系"这一层隐式耦合。用来把 §6.2c 的放大来源再切一刀：
    #   solo1(49m) → 本场景(?) → w_f=0 但 w_c=500(102m 按机) → w_f=0.5(101m 按机)
    # 若本场景 ≈ solo1 ⇒ 放大来自碰撞项；若 ≈ 102 ⇒ 来自共享参考。风扰同 S34，在 Gazebo 侧注入。

  S35_cross5_circle_nosafety_vmax5:         # 实验1(2026-07-09)：与 S34 完全同参，仅 max_speed 3.0→5.0。
    formation: cross5                       # 用于判别"速度饱和"是否为风扰大幅振荡的成因。
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, w_collision: 500.0, max_speed: 5.0, vel_lag_tau: 0.0}  # legacy A 基线，同上
    # 结论：幅值与周期均 ∝ vmax（峰峰 ×1.70 vs vmax ×1.67）→ 饱和是"兜住"发散而非制造它。见 §5.G。

  S37_trio3_circle_rh_lag:                   # 实验5(2026-07-09)：与 S3_trio3_circle_rh 完全同参，仅 vel_lag_tau 0→0.5。
    formation: trio3                        # 验证"圆周相位滞后"是否同源于权限幻觉（§5.G）。无风；safety_filter 默认开。
    leader: {mode: circle, speed: 1.5, radius: 10.0, yaw_mode: center, ready_hold: 20.0, ready_pos_err: 0.3}
    limits: {vel_lag_tau: 0.5}

  S36_cross5_circle_nosafety_lag:           # 实验4(2026-07-09)：与 S34 完全同参，仅 vel_lag_tau 0→0.5。
    formation: cross5                       # 接口一致 MPC：模型 v̇=(v_sp−v)/τ，直接下发 u0。见 §5.G。
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, w_collision: 500.0, vel_lag_tau: 0.5}
    # 改 vel_lag_tau 会改变 OCP 结构 → 必须 `rm -rf ~/.cache/mpc_control/acados_di_mpc_* /tmp/acados_di_mpc_*`。

  # ── 拓扑放大排序实验（2026-07-16，验证论文 §5.6 阻尼裕度公式 ζ(τ,λ) 给出的排序预测：
  #    trio3(λmax=3) < star5(λmax=3.618) < cross5(λmax=5) < grid9(λmax=6)，
  #    预测同等风扰下发散/振荡严重程度按此顺序递增。cross5 复用 S34/S36 现成数据，
  #    trio3 复用 S33（run_one_trial.sh 用 --tau 覆盖为 0.0/0.5，与 S34/S36 一致）。
  #    这两条 star5/grid9 是本次新增，与 S34 逐字同构（仅 formation 不同），供
  #    run_one_trial.sh 以相同 wind_N/wind_delay 协议驱动 ──
  S_star5_circle_nosafety:
    formation: star5
    leader: {mode: circle, speed: 1.0, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, vel_lag_tau: 0.0}

  S_grid9_circle_nosafety:
    formation: grid9
    leader: {mode: circle, speed: 0.5, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, vel_lag_tau: 0.0}

  # ── 拓扑排序规范对照实验（2026-07-16 第二轮）：上面那批 n=2 快速测试里 leader 速度
  #    跨编队未统一(1.5/1.0/1.0/0.5)是个真实混杂因素，排序没吻合理论预测。这四条
  #    _v05 场景把 speed 统一钉死在 0.5(=grid9 原有惯例，四个编队都测过、偏安全)，
  #    duration/wind协议也统一(300s，wind_N=2.0 @ t=100s)，供 n≥5 规范对照跑。
  S_trio3_circle_nosafety_v05:
    formation: trio3
    leader: {mode: circle, speed: 0.5, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, vel_lag_tau: 0.0}

  S_cross5_circle_nosafety_v05:
    formation: cross5
    leader: {mode: circle, speed: 0.5, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, w_collision: 500.0, vel_lag_tau: 0.0}

  # 2026-08-18：与上面 v05 逐字相同，只把 w_collision 降回 defaults 的 200（= trio3/star5/
  # grid9 的 v05 用的值）。上面那条自引入起就带 500，使 §5.6 的"四拓扑受控对比"实际上
  # 不只差拓扑；本条用于把扫描真正配平。两条并存，别删上面那条（已发表数据出自它）。
  S_cross5_circle_nosafety_v05_wc200:
    formation: cross5
    leader: {mode: circle, speed: 0.5, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, vel_lag_tau: 0.0}

  S_star5_circle_nosafety_v05:
    formation: star5
    leader: {mode: circle, speed: 0.5, radius: 10.0, yaw_mode: center, ready_hold: 30.0, ready_pos_err: 0.3}
    limits: {safety_filter_enable: false, vel_lag_tau: 0.0}

  # ── 回归子集 B 组（2026-07-09）：与左侧 A 组基线逐字同参，仅 vel_lag_tau 0→0.5 ──
  # 覆盖 exp4/exp5 未触及的失效模式：静态保持、轴向梯形减速(bug#13)、9 机求解预算、
  # 打乱出生点的大机动收敛(唯一可能绑定 §5.G③ 逐轴箱 vs 范数限幅的工况)。
  # ⚠ 2026-07-14 默认已转 0.5：本组的显式 vel_lag_tau: 0.5 变为冗余（无害，保留作文档）；
  #   对应 A 组基线（S6/S7/S4/S11 等主回归场景）自此也走 0.5——复现 legacy 行为须显式传 0.0。
  S38_cross5_hover_lag:      {formation: cross5, leader: {mode: hover}, limits: {vel_lag_tau: 0.5}}   # ↔ S6
  S39_grid9_hover_lag:       {formation: grid9,  leader: {mode: hover}, limits: {vel_lag_tau: 0.5}}   # ↔ S7
  S40_cross5_line_lag:       {formation: cross5,                                                       # ↔ S4
    leader: {mode: line, speed: 1.0, max_distance: 20.0, ready_hold: 30.0, ready_pos_err: 0.3},
    limits: {vel_lag_tau: 0.5}}
  S41_cross5_perturbed_lag:                                                                            # ↔ S11
    formation: cross5
    birth_override: [[1.0, 0.8, 0], [0.5, 3.4, 0], [-0.7, -2.6, 0],
                     [3.5, -0.6, 0], [-3.5, -0.8, 0]]
    leader: {mode: line, speed: 1.0, max_distance: 20.0, ready_hold: 30.0, ready_pos_err: 0.8}
    limits:
      safety_max_track_dist: 12.0
      w_collision: 400.0
      vel_lag_tau: 0.5

# ── 默认判定阈值（verdict.py 用；scenario.thresholds 可逐项覆盖）──────────────
thresholds:
  min_spacing:        1.8     # 全程最小间距 > 1.8 m（< d_safe=1.5 为危险）
  pos_err:            0.5     # 成型后各机跟踪误差 < 0.5 m
  solve_ms:          12.0     # 单帧最大求解 < 12 ms（grid9 放宽 15）
  safety_violations:    0     # 间距 < 1.5 m 累计帧 = 0
  total_fallbacks:      0     # 降级悬停累计 = 0
